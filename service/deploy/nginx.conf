# /etc/nginx/conf.d/pdfkit.conf
#
# Two settings here are load-bearing rather than cosmetic:
#
#   client_max_body_size   the free tier allows 20 MB per file; nginx's 1 MB
#                          default would reject the upload with 413 before the
#                          app ever sees it, and the browser shows a blank error.
#
#   X-Forwarded-For        must be set to $remote_addr, NOT
#                          $proxy_add_x_forwarded_for.  The latter appends to a
#                          header the client controls, and the app takes the
#                          left-most entry as the rate-limit key -- so anyone
#                          could rotate their own IP by sending a fake header.
server {
    listen 80;
    server_name pdf.example.com;

    # 20 MB file + form overhead; keep a little headroom
    client_max_body_size 25m;
    client_body_timeout 120s;

    # compression is the point of the product; don't recompress PDFs
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # a 118-page scan takes ~25 s to compress on a small box
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;

        # uploads are streamed straight through to the app
        proxy_buffering off;
    }

    # the health endpoint should not be public
    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8090;
    }
}
