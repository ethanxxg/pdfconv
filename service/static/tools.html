<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全部工具 — PDF 在线工具</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
<style>
  .grp{margin-top:30px}
  .grp h2{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 12px;
          letter-spacing:.3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{display:flex;gap:12px;align-items:flex-start;padding:16px;background:var(--card);
        border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;
        transition:.12s}
  .card:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(24,95,165,.09);
              transform:translateY(-1px)}
  .card .ico{width:38px;height:44px;flex:0 0 auto;border-radius:6px;display:flex;
        align-items:center;justify-content:center;font-size:10px;font-weight:600;
        letter-spacing:.2px;background:#e8f0fb;color:#1f5fa8}
  .card .ico.docx{background:#e6eefc;color:#1f4f9c}
  .card .ico.xlsx{background:#e4f3e9;color:#1c6b3c}
  .card .ico.pptx{background:#fbeae4;color:#a3401c}
  .card .ico.merge{background:#e8f0fb;color:#1f5fa8}
  .card .ico.compress{background:#efe9fb;color:#5a3aa0}
  .card .ico.split{background:#e7f4f2;color:#1a6b60}
  .card .ico.extract{background:#eaf3e6;color:#3c6b1c}
  .card .ico.delete{background:#fbe9e7;color:#a3352a}
  .card .ico.rotate{background:#eef0f6;color:#3d4a72}
  .card .ico.image{background:#fdf2e2;color:#8a5a12}
  .card .ico.pdfa{background:#e9eef8;color:#2b4a8a}
  .card .ico.edit{background:#f3eafb;color:#6a3a9c}
  .card .t{font-size:14px;font-weight:500;color:var(--text)}
  .card .d{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:4px}
  .pro{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;
       font-size:10.5px;font-weight:600;letter-spacing:.3px;vertical-align:1px;
       background:#fdf1df;color:#8a5a00;border:1px solid #f0dcbb}
  .capture-cta{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px 18px;
       background:linear-gradient(100deg,#18629f,#2b7fc4);color:#fff;border-radius:12px;
       text-decoration:none}
  .capture-cta .ico{font-size:26px;line-height:1}
  .capture-cta b{font-size:14px;display:block}
  .capture-cta small{font-size:12px;opacity:.9;display:block;margin-top:2px}
  .capture-cta .arrow{margin-left:auto;font-size:20px}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" id="nav"></nav>
  <h1>全部工具</h1>
  <p class="sub">二十四个工具，共用同一套上传、限额与自动删除。无需登录。</p>
  <a class="capture-cta" href="/capture">
    <span class="ico">▣</span>
    <span><b>手机拍照扫描</b><small>打开摄像头，自动裁边拉正，证件/多页/书籍 —— 可添加到主屏幕当 App 用</small></span>
    <span class="arrow">→</span>
  </a>
  <div id="groups"></div>
  <div class="foot">
    文件仅用于本次处理，到期自动删除。<br>
    本站无需登录；为防滥用，按设备与网络地址做频率限制。
  </div>
</div>

<script src="/static/nav.js"></script>
<script>
const GROUPS = [
  ["PDF 转成其他格式", ["pdf-to-word", "pdf-to-excel", "pdf-to-ppt"]],
  ["其他格式转成 PDF", ["word-to-pdf", "excel-to-pdf", "ppt-to-pdf"]],
  ["常用工具", ["merge", "compress"]],
  ["页面工具", ["split", "extract", "delete", "rotate"]],
  ["图片工具", ["pdf-to-image", "image-to-pdf"]],
  ["拍照扫描", ["scan", "idcard"]],
  ["文字识别", ["image-to-text"]],
  ["归档", ["pdfa"]],
  ["编辑工具（Pro）", ["watermark", "redact", "annotate", "stamp", "form", "rewrite"]],
];

(async () => {
  try {
    const r = await fetch("/api/v1/tools");
    const { tools } = await r.json();
    const byId = Object.fromEntries(tools.map(t => [t.id, t]));
    const html = GROUPS.map(([name, ids]) => {
      const cards = ids.map(id => byId[id]).filter(Boolean).map(t => `
        <a class="card" href="${t.path}">
          <div class="ico ${t.icon}">${t.dst.toUpperCase()}</div>
          <div>
            <div class="t">${t.title}${t.pro ? '<span class="pro">PRO</span>' : ""}</div>
            <div class="d">${t.sub}</div>
          </div>
        </a>`).join("");
      return `<div class="grp"><h2>${name}</h2><div class="grid">${cards}</div></div>`;
    }).join("");
    document.getElementById("groups").innerHTML = html;
  } catch (e) {
    document.getElementById("groups").textContent = "工具列表加载失败，请刷新重试。";
  }
})();
</script>
</body>
</html>
