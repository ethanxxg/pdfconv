<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ — 在线免费转换</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  .file{display:none;gap:16px;align-items:flex-start;margin-top:18px;padding:14px;
        background:var(--card);border:1px solid var(--line);border-radius:12px}
  .file.on{display:flex}
  .file .thumb{width:104px;height:128px;flex:0 0 auto;display:flex;align-items:center;
        justify-content:center;background:#fafbfc;border-radius:8px;overflow:hidden}
  .file .thumb img{max-width:100%;max-height:100%;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .file .thumb .ph{color:#c0c6cf;font-size:12px;text-align:center;line-height:1.5;padding:0 6px}
  .file .info{flex:1;min-width:0;padding-top:2px}
  .file .nm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file .meta{color:var(--muted);font-size:13px;margin-top:5px}
  .file .rm{position:static;background:none;border:1px solid var(--line);color:var(--muted);
        border-radius:7px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  .file .rm:hover{border-color:var(--danger);color:var(--danger)}

  .opt{display:none;gap:22px;margin-top:20px;padding:16px 18px;background:var(--card);
       border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
  .opt.show{display:flex}
  .field{flex:1;min-width:170px}
  .field label{display:block;font-size:14px;font-weight:500;color:var(--text);margin-bottom:7px}
  .field select{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);
       border-radius:8px;font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none}
  .field select:focus{border-color:var(--brand)}
  .field .hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:6px}

  .out{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
  .out .ico{width:46px;height:56px;flex:0 0 auto;border-radius:6px;background:#e7f4f2;
       color:#1a6b60;display:flex;align-items:center;justify-content:center;
       font-size:10.5px;font-weight:600;letter-spacing:.3px}
  .out .nm{font-size:15px;font-weight:500;color:var(--text);word-break:break-all}
  .out .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" id="nav"></nav>
  <h1>__TITLE__</h1>
  <p class="sub">__SUB__</p>

  <div class="drop" id="drop">
    <div><b>选择 PDF 文件</b> 或把文件拖到这里</div>
    <small id="limits">单个文件最大 100 MB</small>
    <input type="file" id="picker" accept="application/pdf" hidden>
  </div>

  <div class="file" id="file">
    <div class="thumb" id="thumb"><span class="ph">加载中…</span></div>
    <div class="info">
      <div class="nm" id="fname"></div>
      <div class="meta" id="fmeta"></div>
    </div>
    <button class="rm" id="remove">移除</button>
  </div>

  <div class="opt" id="optbox">
    <div class="field">
      <label for="fmt">图片格式</label>
      <select id="fmt">
        <option value="png">PNG（无损，文字清晰）</option>
        <option value="jpg">JPG（体积更小）</option>
      </select>
    </div>
    <div class="field">
      <label for="dpi">分辨率</label>
      <select id="dpi">
        <option value="150" selected>150 DPI（推荐）</option>
        <option value="300">300 DPI（打印清晰）</option>
        <option value="72">72 DPI（网页用，最小）</option>
      </select>
      <div class="hint">DPI 越高越清晰，文件也越大。</div>
    </div>
  </div>

  <div class="bar">
    <button class="primary" id="go" disabled>__ACTION__</button>
    <span class="hint" id="hint"></span>
  </div>

  <div class="prog" id="prog"><i id="progbar"></i></div>
  <div class="msg" id="msg"></div>

  <div class="result" id="result">
    <div class="ttl">转换完成<span id="rsum"></span></div>
    <div class="out">
      <div class="ico" id="rico">ZIP</div>
      <div>
        <div class="nm" id="rname"></div>
        <div class="meta" id="rmeta"></div>
      </div>
    </div>
    <div class="row">
      <a class="dl" id="rdl" href="#">__RESULT__</a>
      <button class="ghost" id="again">再转一个</button>
    </div>
    <div class="cd">文件将在 <b id="cd">--:--</b> 后自动删除，请及时下载。</div>
  </div>

  <div class="foot">
    文件仅用于本次转换，到期自动删除。<br>
    本站无需登录；为防滥用，按设备与网络地址做频率限制。
  </div>
</div>

<script src="/static/nav.js"></script>
<script>
const TOOL = __TOOL_JSON__;

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let CFG = { max_file_mb: 100, max_pages: 5, ttl: 3600,
            plan: { jobs_left: null, jobs_per_day: 0 } };
let item = null, busy = false, tick = null;

const $ = s => document.querySelector(s);
const drop = $("#drop"), picker = $("#picker"), go = $("#go"), msg = $("#msg"),
      hint = $("#hint"), prog = $("#prog"), progbar = $("#progbar"),
      result = $("#result"), fileBox = $("#file"), optbox = $("#optbox");

document.title = TOOL.title + " — 在线免费转换";

async function fingerprint() {
  const c = document.createElement("canvas");
  c.width = 220; c.height = 40;
  const x = c.getContext("2d");
  x.textBaseline = "top"; x.font = "15px Arial";
  x.fillStyle = "#f60"; x.fillRect(0, 0, 110, 22);
  x.fillStyle = "#069"; x.fillText("pdfmerge-fp-\u{1F5C4}", 2, 4);
  const raw = [c.toDataURL(), navigator.userAgent,
    screen.width + "x" + screen.height + "x" + (screen.colorDepth || 0),
    Intl.DateTimeFormat().resolvedOptions().timeZone,
    (navigator.languages || []).join(","),
    navigator.hardwareConcurrency || 0].join("|");
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw));
  return [...new Uint8Array(buf)].slice(0, 16)
    .map(b => b.toString(16).padStart(2, "0")).join("");
}
let DEVICE = "";

(async () => {
  DEVICE = await fingerprint();
  try {
    const r = await fetch("/api/v1/config",
                          { headers: { "X-Device-Id": DEVICE } });
    if (!r.ok) return;
    const c = await r.json();
    CFG = c;
    $("#limits").textContent =
      `单个文件最大 ${c.max_file_mb} MB，最多 ${c.max_pages} 页`;
    sync();
  } catch (e) {}
})();

/* ---------- intake ---------- */
drop.addEventListener("click", () => { if (!busy) picker.click(); });
drop.addEventListener("dragover", e => { if (!busy) { e.preventDefault(); drop.classList.add("hot"); } });
drop.addEventListener("dragleave", () => drop.classList.remove("hot"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("hot");
  if (!busy) add([...e.dataTransfer.files][0]);
});
picker.addEventListener("change", e => { add([...e.target.files][0]); picker.value = ""; });

function add(f) {
  clearMsg(); hideResult(); showProgress(0);
  if (!f) return;
  if (!/\.pdf$/i.test(f.name) && f.type !== "application/pdf") {
    showMsg("err", "这个工具需要 PDF 文件"); return;
  }
  if (f.size > CFG.max_file_mb * 1048576) {
    showMsg("err", `文件超过 ${CFG.max_file_mb} MB`); return;
  }
  item = { file: f, pages: 0 };
  fileBox.classList.add("on");
  optbox.classList.add("show");
  $("#fname").textContent = f.name;
  $("#fmeta").textContent = mb(f.size) + " · 读取中…";
  $("#thumb").innerHTML = '<span class="ph">加载中…</span>';
  thumb();
  sync();
}

async function thumb() {
  if (!item) return;
  try {
    const data = await item.file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({ data }).promise;
    item.pages = doc.numPages;
    if (CFG.max_pages && item.pages > CFG.max_pages) {
      showMsg("err", `这个文件 ${item.pages} 页，免费版最多 ${CFG.max_pages} 页`);
      item = null;
      fileBox.classList.remove("on");
      optbox.classList.remove("show");
      sync();
      return;
    }
    const page = await doc.getPage(1);
    const vp0 = page.getViewport({ scale: 1 });
    const scale = Math.min(150 / vp0.width, 140 / vp0.height);
    const vp = page.getViewport({ scale });
    const c = document.createElement("canvas");
    c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    const slot = $("#thumb");
    if (!slot) return;
    slot.innerHTML = "";
    const img = new Image();
    img.src = c.toDataURL("image/jpeg", 0.8);
    slot.appendChild(img);
    $("#fmeta").textContent = `${item.pages} 页 · ${mb(item.file.size)}`;
    sync();
  } catch (e) {
    $("#thumb").innerHTML = '<span class="ph">无法预览</span>';
    if (item) $("#fmeta").textContent = mb(item.file.size);
  }
}

$("#remove").onclick = () => {
  if (busy) return;
  item = null;
  fileBox.classList.remove("on");
  optbox.classList.remove("show");
  hideResult(); clearMsg(); showProgress(0);
  sync();
};

function sync() {
  const p = CFG.plan || {};
  const left = p.jobs_left;
  const noQuota = typeof left === "number" && left <= 0;
  go.disabled = busy || !item || noQuota;
  hint.textContent = !item ? ""
    : (left === null || left === undefined)
      ? "今天不限次数"
      : (noQuota ? "今日额度已用完" : `今天还剩 ${left} 次免费额度`);
  if (noQuota && item) {
    showMsg("err", "今天的免费额度已用完，明天再来，或升级 Pro");
  }
}

/* ---------- convert ---------- */
go.onclick = async () => {
  if (busy || !item) return;
  busy = true; setBusy(true); hideResult();
  try {
    showMsg("info", "正在上传…");
    const res = await fetch("/api/v1/uploads", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Device-Id": DEVICE },
      body: JSON.stringify({ files: [{ name: item.file.name, size: item.file.size }] })
    });
    if (!res.ok) throw await apiError(res);
    const { uploads } = await res.json();

    showProgress(1);
    await putFile(uploads[0].url, item.file, sent => {
      const pct = Math.min(99, Math.round(sent / item.file.size * 100));
      showProgress(pct);
      showMsg("info", `正在上传… ${pct}%`);
    });
    showProgress(100);

    showMsg("info", "正在导出图片…");
    const jr = await fetch("/api/v1/jobs", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Device-Id": DEVICE },
      body: JSON.stringify({
        task: "media",
        files: [{ file_id: uploads[0].file_id }],
        options: { op: "pdf2img", fmt: $("#fmt").value,
                   dpi: parseInt($("#dpi").value, 10) || 150,
                   name: item.file.name }
      })
    });
    if (!jr.ok) throw await apiError(jr);
    const job = await jr.json();
    if (typeof job.jobs_left === "number" || job.jobs_left === null) {
      CFG.plan = CFG.plan || {};
      CFG.plan.jobs_left = job.jobs_left;
    }
    await poll(job.job_id);
  } catch (e) {
    showMsg("err", e.message || "出错了，请重试");
    showProgress(0);
  } finally {
    busy = false; setBusy(false); sync();
  }
};

function putFile(url, blob, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("PUT", url, true);
    x.setRequestHeader("Content-Type", "application/pdf");
    x.setRequestHeader("X-Device-Id", DEVICE);
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded); };
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) return resolve();
      let d = {};
      try { d = (JSON.parse(x.responseText).detail) || {}; } catch (e) {}
      reject(new Error(d.message || `上传失败 (${x.status})`));
    };
    x.onerror = () => reject(new Error("网络中断，请重试"));
    x.send(blob);
  });
}

async function poll(jobId) {
  for (let i = 0; i < 900; i++) {
    await new Promise(r => setTimeout(r, 400));
    const r = await fetch("/api/v1/jobs/" + jobId);
    if (!r.ok) throw await apiError(r);
    const j = await r.json();
    if (j.status === "done") {
      showProgress(0);
      clearMsg();
      showResult(j);
      return;
    }
    if (j.status === "failed") throw new Error((j.error && j.error.message) || "转换失败");
    if (j.status === "queued") {
      showMsg("info", "排队中…");
    } else {
      showProgress(100);
      prog.classList.add("indet");
      showMsg("info", "正在导出图片…");
    }
  }
  throw new Error("等待超时，请重试");
}

/* ---------- result ---------- */
function showResult(j) {
  const r = j.result || {};
  const base = (item && item.file.name || "images").replace(/\.[^.]+$/, "");
  $("#rico").textContent = "ZIP";
  $("#rname").textContent = base + ".zip";
  $("#rsum").textContent = ` · ${r.images || j.pages} 张图片`;
  const fmt = (r.fmt || "png").toUpperCase();
  $("#rmeta").textContent =
    `原 ${r.pages || j.pages} 页 · ${fmt} · ${r.dpi || 150} DPI`;
  $("#rdl").href = j.download;
  result.classList.add("on");
  startCountdown(typeof j.expires_in === "number" ? j.expires_in : CFG.ttl);
  result.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function hideResult() {
  result.classList.remove("on");
  if (tick) { clearInterval(tick); tick = null; }
}

function startCountdown(sec) {
  if (tick) clearInterval(tick);
  const el = $("#cd");
  let left = Math.max(0, sec);
  const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  el.textContent = fmt(left);
  tick = setInterval(() => {
    left -= 1;
    el.textContent = fmt(Math.max(0, left));
    if (left <= 0) {
      clearInterval(tick); tick = null;
      el.textContent = "已过期";
      result.classList.remove("on");
      showMsg("err", "结果已过期删除，请重新转换。");
    }
  }, 1000);
}

$("#again").onclick = () => {
  item = null;
  fileBox.classList.remove("on");
  optbox.classList.remove("show");
  hideResult(); clearMsg(); showProgress(0); sync();
  window.scrollTo({ top: 0, behavior: "smooth" });
};

/* ---------- misc ---------- */
function setBusy(on) {
  drop.classList.toggle("busy", on);
  go.textContent = on ? "转换中…" : TOOL.action;
  $("#fmt").disabled = on; $("#dpi").disabled = on;
}

function showProgress(pct) {
  if (!pct) {
    prog.classList.remove("on", "indet");
    progbar.style.width = "0%";
    return;
  }
  prog.classList.add("on");
  progbar.style.width = pct + "%";
}

async function apiError(res) {
  let d = {};
  try { d = (await res.json()).detail || {}; } catch (e) {}
  if (res.status === 429) return new Error(d.message || "请求过于频繁，请稍后再试");
  if (res.status === 503) return new Error(d.message || "服务繁忙，请稍后重试");
  return new Error(d.message || `请求失败 (${res.status})`);
}
function showMsg(kind, text) { msg.className = "msg " + kind; msg.textContent = text; }
function clearMsg() { msg.className = "msg"; msg.textContent = ""; }
function mb(n) { return n > 1048576 ? (n / 1048576).toFixed(2) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
</script>
</body>
</html>
